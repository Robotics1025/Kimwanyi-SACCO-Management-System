<ui:composition
        template="/WEB-INF/templates/login-template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="jakarta.faces.html"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:pt="jakarta.faces.passthrough">

    <ui:define name="title">
        Login | Kimwanyi SACCO
    </ui:define>

    <ui:define name="formContent">

        <style>
            .form-heading {
                font-size: 2rem;
                font-weight: 800;
                color: #111827;
            }
            .form-subtitle {
                margin-top: 0.4rem;
                color: #6b7280;
                font-size: 0.9rem;
            }
            .login-form {
                margin-top: 2rem;
            }
            .field {
                margin-bottom: 1.25rem;
            }
            .field label {
                display: block;
                font-size: 0.875rem;
                font-weight: 600;
                color: #374151;
                margin-bottom: 0.4rem;
            }
            .input-wrap {
                position: relative;
            }
            .input-icon {
                position: absolute;
                top: 50%;
                left: 0.9rem;
                transform: translateY(-50%);
                color: #9ca3af;
                pointer-events: none;
                display: flex;
            }
            .input-eye {
                position: absolute;
                top: 50%;
                right: 0.9rem;
                transform: translateY(-50%);
                color: #9ca3af;
                cursor: pointer;
                display: flex;
            }
            .sacco-field {
                width: 100%;
                padding: 0.85rem 1rem 0.85rem 2.75rem;
                border: 1px solid #d1d5db;
                border-radius: 0.75rem;
                font-size: 0.9rem;
                color: #111827;
                background: #f9fafb;
                outline: none;
                transition: border-color 0.2s, box-shadow 0.2s;
            }
            .sacco-field:focus {
                border-color: #dc2626;
                background: #ffffff;
                box-shadow: 0 0 0 3px rgba(220,38,38,0.12);
            }
            .sacco-field-eye { padding-right: 2.75rem; }
            .remember-row {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                margin-bottom: 1.5rem;
                font-size: 0.875rem;
                color: #374151;
                cursor: pointer;
            }
            .remember-row input[type="checkbox"] {
                width: 1rem;
                height: 1rem;
                accent-color: #dc2626;
                cursor: pointer;
            }
            .btn-signin {
                width: 100%;
                background: #dc2626;
                color: white;
                border: none;
                border-radius: 0.75rem;
                padding: 1rem;
                font-size: 1rem;
                font-weight: 700;
                letter-spacing: 0.06em;
                cursor: pointer;
                transition: background 0.2s;
            }
            .btn-signin:hover { background: #b91c1c; }
            .register-row {
                margin-top: 1.25rem;
                text-align: center;
                font-size: 0.875rem;
                color: #6b7280;
            }
            .register-row a {
                color: #dc2626;
                font-weight: 700;
                text-decoration: none;
            }
            .register-row a:hover { text-decoration: underline; }
            .login-messages {
                display: block;
                margin-top: 1.25rem;
                border-radius: 0.75rem;
                background: #fef2f2;
                padding: 0.75rem 1rem;
                color: #b91c1c;
                font-size: 0.875rem;
            }
            .login-messages:empty { display: none; }
        </style>

        <h2 class="form-heading">Welcome Back!</h2>
        <p class="form-subtitle">Please sign in to continue</p>

        <h:messages globalOnly="true" styleClass="login-messages"/>

        <h:form styleClass="login-form">

            <!-- Username -->
            <div class="field">
                <h:outputLabel for="username" value="Username or Email"/>
                <div class="input-wrap">
                    <span class="input-icon">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                    <h:inputText id="username" value="#{loginBean.loginForm.username}"
                                 pt:placeholder="Enter username or email"
                                 styleClass="sacco-field"/>
                </div>
            </div>

            <!-- Password -->
            <div class="field">
                <h:outputLabel for="password" value="Password"/>
                <div class="input-wrap">
                    <span class="input-icon">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4"/>
                        </svg>
                    </span>
                    <h:inputSecret id="password" value="#{loginBean.loginForm.password}"
                                   pt:placeholder="Enter password"
                                   styleClass="sacco-field sacco-field-eye"/>
                    <span class="input-eye">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </span>
                </div>
            </div>

            <!-- Remember me -->
            <label class="remember-row">
                <input type="checkbox"/>
                Remember me
            </label>

            <!-- Sign In -->
            <h:commandButton value="SIGN IN"
                             action="#{loginBean.login}"
                             styleClass="btn-signin"/>

            <!-- Register link -->
            <div class="register-row">
                Don't have an account?&#160;
                <h:link value="REGISTER" outcome="/members/register.xhtml"/>
            </div>

        </h:form>

    </ui:define>

    <ui:define name="sideContent">

        <style>
            .side-heading {
                font-size: 1.8rem;
                font-weight: 800;
                color: white;
                line-height: 1.3;
            }
            .side-text {
                margin-top: 1rem;
                color: rgba(255,255,255,0.85);
                font-size: 0.95rem;
                line-height: 1.6;
            }
            .btn-register {
                display: inline-block;
                margin-top: 2rem;
                border: 2px solid white;
                border-radius: 0.75rem;
                padding: 0.85rem 2.5rem;
                color: white;
                font-weight: 700;
                font-size: 0.9rem;
                letter-spacing: 0.06em;
                text-decoration: none;
                transition: background 0.2s, color 0.2s;
            }
            .btn-register:hover {
                background: white;
                color: #dc2626;
            }
        </style>

        <h2 class="side-heading">Join Kimwanyi SACCO</h2>

        <p class="side-text">
            Create an account today and enjoy seamless access to our services.
        </p>

        <h:link value="REGISTER NOW"
                outcome="/members/register.xhtml"
                styleClass="btn-register"/>

    </ui:define>

</ui:composition>
