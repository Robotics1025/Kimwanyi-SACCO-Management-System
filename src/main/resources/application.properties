# Kimwanyi SACCO Management System - application configuration
app.name=Kimwanyi SACCO Management System
app.environment=${APP_ENVIRONMENT:development}

db.url=${DB_URL:jdbc:mysql://localhost:3306/kimwanyi_sacco}
# Local default uses the restricted localhost-only development account created
# by docs/setup-guide.md. Production deployments must override all DB_* values.
db.username=${DB_USERNAME:kimwanyi_app}
db.password=${DB_PASSWORD:}
db.driver=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

hibernate.hbm2ddl.auto=${HIBERNATE_DDL_AUTO:update}
hibernate.show_sql=${HIBERNATE_SHOW_SQL:false}
hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

# The initial administrator is created only when INITIAL_ADMIN_PASSWORD is set.
# Never commit the password. Change these optional identity values through the environment.
app.initial-admin.username=${INITIAL_ADMIN_USERNAME:admin}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}
app.initial-admin.email=${INITIAL_ADMIN_EMAIL:admin@kimwanyisacco.com}

# Outbound Gmail SMTP. Use a Google App Password, never the normal account password.
mail.enabled=${MAIL_ENABLED:false}
mail.host=${MAIL_HOST:smtp.gmail.com}
mail.port=${MAIL_PORT:587}
mail.username=${MAIL_USERNAME:}
mail.password=${MAIL_PASSWORD:}
mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
